# Builds the app and publishes it to S3 + CloudFront on every push to main.
# AWS access uses GitHub OIDC: the role ARN lives in the repository variable AWS_DEPLOY_ROLE_ARN.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: salary-calculator-cr
  CLOUDFRONT_DISTRIBUTION_ID: E1H3IDN4WYTR5G

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed file names change on every build, so assets can be cached for a year.
      - name: Upload assets
        run: >
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets"
          --cache-control "public, max-age=31536000, immutable"

      # index.html keeps its name, so browsers must revalidate it on every visit.
      - name: Upload index.html
        run: >
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html"
          --cache-control "no-cache"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/index.html"
